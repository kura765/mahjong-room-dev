<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>麻雀共有ルーム 開発ラボ（非公開テスト）</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#192335;font:15px/1.6 system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{max-width:650px;margin:auto;padding:24px 14px 80px}
h1{font-size:23px;margin:6px 0 2px}h2{font-size:17px;margin:0 0 10px}
p{margin:8px 0}small,.muted{color:#667085}section{background:white;border:1px solid #e2e6ee;border-radius:15px;padding:17px;margin:14px 0}
label{display:block;font-weight:650;margin:10px 0 4px;font-size:13px}
input{display:block;width:100%;height:46px;border:1px solid #d6dde9;border-radius:10px;padding:0 12px;font:inherit;min-width:0}
button{border:0;background:#2663ea;color:#fff;border-radius:10px;min-height:44px;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer}
button.ghost{background:#e9efff;color:#2155bb}button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{min-width:0}.hide{display:none!important}
#message{white-space:pre-wrap;background:#edf4ff;color:#184680;padding:12px;border-radius:9px}
.room{border-top:1px solid #e2e6ee;padding:14px 0}
.meta{font-size:12px;color:#667085}.readonly{background:#f7f8fa;padding:10px;border-radius:8px}
</style></head>
<body><main>
<h1>共有ルーム開発ラボ</h1><p class="muted">v3.0試験用：本番の対局・ローカル記録とは分離されています。</p>
<section><h2>開発プロジェクトに接続</h2><p class="muted">SupabaseのProject URLと公開用（publishable / anon）キーのみ使用。service_roleやsecretキーは絶対に入力しないでください。</p>
<label for="projectUrl">Project URL</label><input id="projectUrl" placeholder="https://xxxxx.supabase.co" autocomplete="off">
<label for="publicKey">Publishable key / anon key</label><input id="publicKey" placeholder="sb_publishable_... または公開anonキー" autocomplete="off">
<div class="row" style="margin-top:12px"><button id="connectBtn">接続</button><button class="ghost" id="disconnectBtn">接続設定を消す</button></div></section>
<section id="authBox" class="hide"><h2>作成者ログイン</h2>
<p id="authStatus" class="muted">未ログイン</p>
<label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" placeholder="example@example.com">
<div class="row" style="margin-top:12px"><button id="signInBtn">ログイン用リンクを送る</button><button class="ghost" id="signOutBtn">ログアウト</button></div>
</section>
<section id="roomBox" class="hide"><h2>テストルーム</h2>
<p class="muted">最初は架空のテストデータだけを使います。招待・リアルタイム配信はまだ未実装です。</p>
<label for="roomTitle">部屋名</label><input id="roomTitle" value="動作確認用の半荘">
<div class="row" style="margin-top:12px"><button id="createRoomBtn">テストルームを作成</button><button class="ghost" id="reloadRoomsBtn">一覧を更新</button></div>
<div id="roomList"></div></section>
<section id="currentBox" class="hide"><h2 id="currentTitle">選択中のルーム</h2>
<div class="meta" id="currentMeta"></div>
<div class="readonly" id="snapshotView"></div>
<div class="row" style="margin-top:12px"><button id="incrementBtn">テスト用カウントを＋1</button><button class="ghost" id="refreshBtn">再読み込み</button></div>
<p class="muted">この段階では本物の局結果を編集しません。更新権限と競合対策だけの検証です。</p>
</section>
<section><h2>動作状況</h2><div id="message" role="status" aria-live="polite">接続設定を入力すると開始できます。</div></section>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const $=id=>document.getElementById(id);
const CONFIG_KEY='mahjong-room-lab-public-config'; // Only URL + publishable key, never credentials
let client=null,user=null,current=null,revision=null;
function show(id,on){$(id).classList.toggle('hide',!on)}
function notify(msg){$('message').textContent=msg}
function fail(e){notify(e?.message||String(e))}
function resetRoom(){current=null;revision=null;show('currentBox',false)}
function resetAuth(){user=null;show('roomBox',false);resetRoom();$('authStatus').textContent='未ログイン'}
function validateConfig(){
 const url=$('projectUrl').value.trim(),key=$('publicKey').value.trim();
 if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(url))throw Error('Project URLの形式を確認してください。');
 if(!key||/service_role|sb_secret_/i.test(key))throw Error('秘密鍵は使用できません。publishable / anonキーのみ入力してください。');
 return {url:url.replace(/\/$/,''),key};
}
async function connect(){
 try{
  const {url,key}=validateConfig();
  client=createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'mahjong-room-lab-auth'}});
  localStorage.setItem(CONFIG_KEY,JSON.stringify({url,key}));
  show('authBox',true);
  const {data,error}=await client.auth.getUser();if(error&&error.name!=='AuthSessionMissingError')throw error;
  user=data?.user||null;await updateAuth();
  notify('開発プロジェクトに接続しました。');
 }catch(e){fail(e)}
}
async function updateAuth(){
 if(!client)return;
 const {data,error}=await client.auth.getUser();
 if(error&&error.name!=='AuthSessionMissingError'){fail(error);resetAuth();return}
 user=data?.user||null;
 $('authStatus').textContent=user?'ログイン中：'+(user.email||user.id):'未ログイン';
 show('roomBox',!!user);
 if(user){await loadRooms()}else resetRoom();
}
async function signIn(){
 if(!client)return notify('先に接続してください。');
 const email=$('email').value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return notify('正しいメールアドレスを入力してください。');
 const {error}=await client.auth.signInWithOtp({email,emailRedirectTo:location.origin+location.pathname});
 if(error)return fail(error);
 notify('ログイン用メールを送信しました。メール内のリンクでこのテスト画面に戻ってください。');
}
async function loadRooms(){
 if(!user)return;
 const {data,error}=await client.from('mahjong_rooms').select('id,title,match_date,status,owner_id').order('created_at',{ascending:false}).limit(30);
 if(error)return fail(error);
 $('roomList').replaceChildren();
 if(!data.length){$('roomList').textContent='まだ部屋がありません。';return}
 for(const room of data){
  const box=document.createElement('div');box.className='room';
  const title=document.createElement('div');title.textContent=room.title+' — '+room.match_date;
  const meta=document.createElement('small');meta.textContent=room.owner_id===user.id?'作成者':'閲覧者';
  const button=document.createElement('button');button.className='ghost';button.textContent='開く';button.onclick=()=>openRoom(room.id);
  box.append(title,meta,document.createElement('br'),button);$('roomList').append(box);
 }
}
async function createRoom(){
 if(!user)return;
 const title=$('roomTitle').value.trim();if(!title||title.length>100)return notify('部屋名を1〜100文字で入力してください。');
 $('createRoomBtn').disabled=true;
 try{
  const {data,error}=await client.from('mahjong_rooms').insert({owner_id:user.id,title,match_date:new Date().toLocaleDateString('sv-SE')}).select('id').single();
  if(error)throw error;
  const {error:se}=await client.from('mahjong_room_snapshots').insert({room_id:data.id,revision:0,updated_by:user.id,payload:{testCounter:0,kind:'development-only'}});
  if(se){notify('ルームは作成しましたが、初期データ保存に失敗：'+se.message);return}
  notify('テストルームを作成しました。');await loadRooms();await openRoom(data.id);
 }catch(e){fail(e)}finally{$('createRoomBtn').disabled=false}
}
async function openRoom(id){
 if(!client||!user)return;
 const {data:room,error}=await client.from('mahjong_rooms').select('id,title,owner_id,status').eq('id',id).single();
 if(error)return fail(error);
 current=room;show('currentBox',true);$('currentTitle').textContent=room.title;
 $('currentMeta').textContent=room.owner_id===user.id?'作成者（編集可）':'参加者（閲覧のみ）';
 $('incrementBtn').disabled=room.owner_id!==user.id;
 await refresh();
}
async function refresh(){
 if(!current)return;
 const {data,error}=await client.from('mahjong_room_snapshots').select('revision,payload,updated_at').eq('room_id',current.id).single();
 if(error)return fail(error);
 revision=data.revision;
 $('snapshotView').textContent='更新番号: '+revision+'\nテスト回数: '+(data.payload?.testCounter||0)+'\n最終更新: '+(data.updated_at||'未設定');
}
async function increment(){
 if(!current||current.owner_id!==user?.id||revision===null)return;
 $('incrementBtn').disabled=true;
 try{
  const {data:existing,error:e}=await client.from('mahjong_room_snapshots').select('revision,payload').eq('room_id',current.id).single();
  if(e)throw e;
  const next={...existing.payload,testCounter:(Number(existing.payload?.testCounter)||0)+1};
  const {error}=await client.rpc('mahjong_write_snapshot',{p_room_id:current.id,p_expected_revision:existing.revision,p_payload:next});
  if(error)throw error;
  notify('テストデータを保存しました。');
 }catch(e){fail(e)}finally{$('incrementBtn').disabled=false;await refresh()}
}
$('connectBtn').onclick=connect;
$('disconnectBtn').onclick=async()=>{if(client)await client.auth.signOut();client=null;resetAuth();show('authBox',false);localStorage.removeItem(CONFIG_KEY);$('projectUrl').value='';$('publicKey').value='';notify('接続を解除しました。')};
$('signInBtn').onclick=signIn;
$('signOutBtn').onclick=async()=>{if(client)await client.auth.signOut();await updateAuth()};
$('createRoomBtn').onclick=createRoom;
$('reloadRoomsBtn').onclick=loadRooms;
$('refreshBtn').onclick=refresh;
$('incrementBtn').onclick=increment;
try{const saved=JSON.parse(localStorage.getItem(CONFIG_KEY)||'null');if(saved&&saved.url&&saved.key){$('projectUrl').value=saved.url;$('publicKey').value=saved.key;connect()}}catch(e){/* Invalid saved config: manual connection remains available. */}
</script></body></html>
