name: v3 Migration SQL regression

on:
  push:
    paths:
      - 'supabase/20261125_safe_readonly_import.sql'
      - 'supabase/20261125_safe_readonly_import_regression.sql'
      - 'supabase/test_fixture_minimal.sql'
      - '.github/workflows/migration-sql-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mahjong_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated Supabase fixture schema
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres \
            -v "$PWD:/work:ro" -w /work postgres:16 \
            psql -h 127.0.0.1 -U postgres -d mahjong_test -v ON_ERROR_STOP=1 \
            -f supabase/test_fixture_minimal.sql
      - name: Apply staged import RPC migration to ephemeral Postgres
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres \
            -v "$PWD:/work:ro" -w /work postgres:16 \
            psql -h 127.0.0.1 -U postgres -d mahjong_test -v ON_ERROR_STOP=1 \
            -f supabase/20261125_safe_readonly_import.sql
      - name: Run rollback-only SQL regression
        run: |
          sed 's/REPLACE_WITH_EXISTING_DEV_OWNER_UUID/00000000-0000-4000-8000-000000000123/g' \
            supabase/20261125_safe_readonly_import_regression.sql | \
          docker run --rm -i --network host -e PGPASSWORD=postgres postgres:16 \
            psql -h 127.0.0.1 -U postgres -d mahjong_test -v ON_ERROR_STOP=1
      - name: Verify regression left no imported rows
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres postgres:16 \
            psql -h 127.0.0.1 -U postgres -d mahjong_test -v ON_ERROR_STOP=1 \
            -c "DO \\\$\\\$ BEGIN IF EXISTS (SELECT 1 FROM public.mahjong_legacy_imports) THEN RAISE EXCEPTION 'Regression test did not roll back'; END IF; END \\\$\\\$;"
